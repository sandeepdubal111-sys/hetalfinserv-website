function AreaChartSVG({ data, xKey, yKey, height = 300, lineColor = "var(--orange)", refLinesX = [], yFormat = formatINR }) {
  const W = 700;
  const pad = { l: 64, r: 20, t: 16, b: 32 };
  const xs = data.map((d) => d[xKey]);
  const ys = data.map((d) => d[yKey]);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const maxY = niceMax(Math.max(...ys, 1));
  const xScale = buildScale([minX, maxX], [pad.l, W - pad.r]);
  const yScale = buildScale([0, maxY], [height - pad.b, pad.t]);
  const pts = data.map((d) => [xScale(d[xKey]), yScale(d[yKey])]);
  const linePath = "M " + pts.map((p) => p.join(",")).join(" L ");
  const areaPath = `${linePath} L ${xScale(maxX)},${yScale(0)} L ${xScale(minX)},${yScale(0)} Z`;
  const step = Math.max(1, Math.round(data.length / 8));
  return (
    <svg viewBox={`0 0 ${W} ${height}`} width="100%">
      {[0, 0.25, 0.5, 0.75, 1].map((f, i) => {
        const val = maxY * f, y = yScale(val);
        return (
          <g key={i}>
            <line x1={pad.l} x2={W - pad.r} y1={y} y2={y} stroke="var(--grid-line)" strokeDasharray="3 3" />
            <text x={pad.l - 8} y={y + 4} textAnchor="end" fontSize="11" fill="var(--text-muted)">{yFormat(val)}</text>
          </g>
        );
      })}
      {data.map((d, i) => (i % step === 0 ? (
        <text key={i} x={xScale(d[xKey])} y={height - 6} textAnchor="middle" fontSize="11" fill="var(--text-muted)">{d[xKey]}</text>
      ) : null))}
      {refLinesX.map((rl, i) => (
        <g key={i}>
          <line x1={xScale(rl.x)} x2={xScale(rl.x)} y1={pad.t} y2={height - pad.b} stroke={rl.color || "var(--navy)"} strokeDasharray="4 4" />
          {rl.label && <text x={xScale(rl.x)} y={pad.t + 10} textAnchor="middle" fontSize="10.5" fill={rl.color || "var(--navy)"}>{rl.label}</text>}
        </g>
      ))}
      <path d={areaPath} fill={lineColor} fillOpacity="0.18" stroke="none" />
      <path d={linePath} fill="none" stroke={lineColor} strokeWidth="2.5" />
    </svg>
  );
}

function ComposedChartSVG({ data, xKey, barKey, lineKey, height = 300, barColor = "var(--navy-mid)", lineColor = "var(--orange)", targetY, yFormat = formatINR }) {
  const W = 700;
  const pad = { l: 64, r: 20, t: 16, b: 32 };

  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const maxY = niceMax(Math.max(...data.map((d) => d[barKey]), ...data.map((d) => d[lineKey]), targetY || 0, 1));
  const xScale = buildScale([minX, maxX], [pad.l, W - pad.r]);
  const yScale = buildScale([0, maxY], [height - pad.b, pad.t]);
  const n = data.length;
  const barWidth = Math.max(3, ((W - pad.l - pad.r) / n) * 0.5);
  const linePts = data.map((d) => [xScale(d[xKey]), yScale(d[lineKey])]);
  const linePath = "M " + linePts.map((p) => p.join(",")).join(" L ");
  const step = Math.max(1, Math.round(n / 8));
  return (
    <svg viewBox={`0 0 ${W} ${height}`} width="100%">
      {[0, 0.25, 0.5, 0.75, 1].map((f, i) => {
        const val = maxY * f, y = yScale(val);
        return (
          <g key={i}>
            <line x1={pad.l} x2={W - pad.r} y1={y} y2={y} stroke="var(--grid-line)" strokeDasharray="3 3" />
            <text x={pad.l - 8} y={y + 4} textAnchor="end" fontSize="11" fill="var(--text-muted)">{yFormat(val)}</text>

      {data.map((d, i) => {

}

function BarChartSVG({ data, xKey, yKey, height = 260, colors = [], yFormat = formatINR }) {
  const W = 700;
  const pad = { l: 64, r: 20, t: 16, b: 32 };
  const maxY = niceMax(Math.max(...data.map((d) => d[yKey]), 1));
  const yScale = buildScale([0, maxY], [height - pad.b, pad.t]);
  const n = data.length;
  const slot = (W - pad.l - pad.r) / n;
  const barWidth = slot * 0.5;
  return (
    <svg viewBox={`0 0 ${W} ${height}`} width="100%">
      {[0, 0.25, 0.5, 0.75, 1].map((f, i) => {
        const val = maxY * f, y = yScale(val);
        return (
          <g key={i}>
            <line x1={pad.l} x2={W - pad.r} y1={y} y2={y} stroke="var(--grid-line)" strokeDasharray="3 3" />
            <text x={pad.l - 8} y={y + 4} textAnchor="end" fontSize="11" fill="var(--text-muted)">{yFormat(val)}</text>
          </g>
        );
      })}
      {data.map((d, i) => {
        const cx = pad.l + slot * i + slot / 2;
        const x = cx - barWidth / 2;
        const y = yScale(d[yKey]);
        const h = Math.max(0, (height - pad.b) - y);
        return (
          <g key={i}>
            <rect x={x} y={y} width={barWidth} height={h} fill={colors[i] || "var(--navy)"} rx="4" />

  );
}

// ---- window.storage polyfill: same API Claude artifacts get, backed by this browser's localStorage ----
// Saved clients live on THIS device/browser only (no cross-device sync, unlike the Claude-hosted version).
if (!window.storage) {
  const PFX = "wb_store_";
  window.storage = {
    async get(key, shared) {
      const raw = localStorage.getItem(PFX + key);
      if (raw === null) throw new Error("key not found");
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared) {
      localStorage.setItem(PFX + key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      localStorage.removeItem(PFX + key);
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(PFX + (prefix || ""))) keys.push(k.slice(PFX.length));
      }
      return { keys, prefix, shared: !!shared };
    },
  };
}


/* ---------------------------------------------------------------
   FINANCE ENGINE
   All formulas operate on annual % rates, converted to monthly
   where compounding matters. Kept transparent & auditable.
---------------------------------------------------------------- */

const monthlyRate = (annualPct) => Math.pow(1 + annualPct / 100, 1 / 12) - 1;

const fvLumpsum = (pv, annualPct, years) => pv * Math.pow(1 + annualPct / 100, Math.max(years, 0));

const fvSIP = (pmt, annualPct, years) => {
  const r = monthlyRate(annualPct);
  const n = Math.round(years * 12);
  if (n <= 0) return 0;
  if (r === 0) return pmt * n;
  return pmt * ((Math.pow(1 + r, n) - 1) / r) * (1 + r);
};

const requiredSIP = (fv, annualPct, years) => {
  const r = monthlyRate(annualPct);
  const n = Math.round(years * 12);
  if (n <= 0) return fv;
  if (r === 0) return fv / n;
  return (fv * r) / ((Math.pow(1 + r, n) - 1) * (1 + r));
};

const pvGrowingAnnuity = (pmtFirstAnnual, discAnnualPct, growAnnualPct, years) => {
  const r = monthlyRate(discAnnualPct);
  const g = monthlyRate(growAnnualPct);
  const n = Math.round(years * 12);
  const pmtMonthly = pmtFirstAnnual / 12;
  if (n <= 0) return 0;
  if (Math.abs(r - g) < 1e-9) return (pmtMonthly * n) / (1 + r);
  return (pmtMonthly * (1 - Math.pow((1 + g) / (1 + r), n))) / (r - g);
};

const goalReturnRate = (years, eq, debt) => {
  if (years >= 5) return eq;
  if (years >= 2) return (eq + debt) / 2;
  return debt;
};

const formatINR = (num, compact = true) => {
  if (num === null || num === undefined || isNaN(num)) return "₹0";
  const neg = num < 0;
  num = Math.abs(Math.round(num));
  let out;
  if (compact && num >= 10000000) out = (num / 10000000).toFixed(2) + " Cr";
  else if (compact && num >= 100000) out = (num / 100000).toFixed(2) + " L";
  else out = num.toLocaleString("en-IN");
  return (neg ? "-₹" : "₹") + out;
};

/* ---------------------------------------------------------------
   MUTUAL FUND ENGINE
   One growth function covers SIP / Lumpsum / SIP+Lumpsum / Step-up SIP
   (each is just a parameterization). A separate function covers both
   SWP variants (fixed & inflation-growing withdrawal).
---------------------------------------------------------------- */

const simulateGrowth = ({ lumpsum = 0, sip = 0, rate, years, stepType = "percent", stepValue = 0 }) => {
  const r = monthlyRate(rate);
  let corpus = lumpsum;
  let invested = lumpsum;
  let pmt = sip;
  const data = [{ year: 0, invested: Math.round(invested), value: Math.round(corpus) }];
  const totalMonths = Math.round(years * 12);
  for (let m = 1; m <= totalMonths; m++) {
    corpus = (corpus + pmt) * (1 + r);
    invested += pmt;
    if (m % 12 === 0) {
      data.push({ year: m / 12, invested: Math.round(invested), value: Math.round(corpus) });
      pmt = stepType === "percent" ? pmt * (1 + stepValue / 100) : pmt + stepValue;
    }
  }
  return { data, finalValue: corpus, totalInvested: invested, gain: corpus - invested };
};

// Progressive income-tax slab calculator: walks each bracket, applies Section 87A rebate
// if taxable income is at/below the rebate threshold, then adds 4% health & education cess.
const computeSlabTax = (taxable, slabs, rebateThreshold, rebateMax) => {
  let tax = 0, prev = 0;
  for (const [limit, rate] of slabs) {
    if (taxable > prev) {
      tax += (Math.min(taxable, limit) - prev) * rate;
      prev = limit;
    } else break;
  }
  const rebate = taxable <= rebateThreshold ? Math.min(tax, rebateMax) : 0;
  const taxAfterRebate = Math.max(0, tax - rebate);
  const cess = taxAfterRebate * 0.04;
  return { taxable: Math.round(taxable), tax: Math.round(tax), rebate: Math.round(rebate), cess: Math.round(cess), totalTax: Math.round(taxAfterRebate + cess) };
};

const simulateSWP = ({ corpus, initialWithdrawal, rate, years, growing = false, inflation = 0, baseAge = null }) => {
  const r = monthlyRate(rate);
  let balance = corpus;
  let withdrawal = initialWithdrawal;
  const rows = [{ year: 0, age: baseAge != null ? baseAge : null, opening: Math.round(corpus), monthlyWithdrawal: Math.round(withdrawal), annualWithdrawn: 0, closing: Math.round(corpus), shortfall: 0 }];
  let depletedYear = null;
  let totalWithdrawn = 0;
  let totalShortfall = 0;

  for (let y = 1; y <= years; y++) {
    const opening = balance;
    if (opening <= 0) {
      // Corpus already exhausted in an earlier year: this year's full withdrawal need goes unmet.
      const need = withdrawal * 12;
      totalShortfall += need;
      rows.push({ year: y, age: baseAge != null ? baseAge + y : null, opening: 0, monthlyWithdrawal: Math.round(withdrawal), annualWithdrawn: 0, closing: 0, shortfall: Math.round(need) });
    } else {
      let annualWithdrawn = 0;
      for (let m = 1; m <= 12; m++) {
        balance = balance * (1 + r) - withdrawal;
        annualWithdrawn += withdrawal;
        totalWithdrawn += withdrawal;
        if (balance <= 0 && depletedYear === null) depletedYear = Math.round((y - 1 + m / 12) * 10) / 10;
        if (balance <= 0) balance = 0;
      }
      rows.push({
        year: y, age: baseAge != null ? baseAge + y : null, opening: Math.round(opening), monthlyWithdrawal: Math.round(withdrawal),
        annualWithdrawn: Math.round(annualWithdrawn), closing: Math.round(balance), shortfall: 0,
      });
    }
    if (growing) withdrawal = withdrawal * (1 + inflation / 100);
  }
  return { rows, depletedYear, totalWithdrawn, totalShortfall: Math.round(totalShortfall), finalBalance: Math.max(0, balance) };
};

/* ---------------------------------------------------------------
   RETIREMENT CASH-FLOW ILLUSTRATION (for the print report)
   Pre-retirement: pure accumulation of today's assets + ongoing
   savings toward retirement (goal withdrawals excluded, matching
   standard CFP-report convention of isolating the retirement view).
   Post-retirement: draws the REQUIRED corpus down at the growing
   expense, continuing past life expectancy so a client can see the
   shortfall if they live longer than planned (shown as negative).
---------------------------------------------------------------- */
const computeRetirementCashFlows = (profile, assets, retirementCalc) => {
  const rEq = profile.equityReturn / 100, rDebt = profile.debtReturn / 100, rGold = 0.08, rRE = 0.07, rCash = 0.035;
  const totalAssets = assets.equity + assets.debt + assets.gold + assets.realEstate + assets.cash;
  const blended = totalAssets > 0
    ? (assets.equity * rEq + assets.debt * rDebt + assets.gold * rGold + assets.realEstate * rRE + assets.cash * rCash) / totalAssets
    : rEq;

  const preRows = [];
  for (let y = 0; y <= retirementCalc.yearsToRet; y++) {
    const age = profile.currentAge + y;
    const yearlyExpense = fvLumpsum(profile.monthlyExpenses * 12, profile.preRetInflation, y);
    const corpusValue = fvLumpsum(totalAssets, blended * 100, y) + fvSIP(profile.existingMonthlySavings, blended * 100, y);
    preRows.push({ age, yearlyExpense, corpusValue });
  }

  const postRows = [];
  const rMonthly = monthlyRate(profile.postRetReturn);
  const gMonthly = monthlyRate(profile.postRetInflation);
  let balance = retirementCalc.requiredCorpus;
  let monthlyWithdrawal = retirementCalc.expenseAtRetirement / 12;
  const maxAge = Math.max(profile.lifeExpectancy + 10, profile.retirementAge + retirementCalc.retDuration + 6);
  for (let age = profile.retirementAge + 1; age <= maxAge; age++) {
    let annualWithdrawn = 0;
    for (let m = 1; m <= 12; m++) {
      balance = balance * (1 + rMonthly) - monthlyWithdrawal;
      annualWithdrawn += monthlyWithdrawal;
      monthlyWithdrawal = monthlyWithdrawal * (1 + gMonthly);
    }
    postRows.push({ age, withdrawal: annualWithdrawn, balance });
  }
  return { preRows, postRows };
};

/* ---------------------------------------------------------------
   MONTE CARLO SIMULATION
   The one capability that separates institutional-grade planning
   software (MoneyGuidePro, eMoney, RightCapital) from a deterministic
   calculator: instead of assuming one fixed return every year, run
   hundreds of randomized-return trials and report what fraction of
   them never run out of money -- the "Probability of Success."
---------------------------------------------------------------- */

// Box-Muller transform: converts uniform random draws into a normal (bell-curve) distribution,
// so simulated annual returns cluster around the mean the way real market returns roughly do.
const randomNormal = (mean, stdDev) => {
  let u1 = Math.random(), u2 = Math.random();
  if (u1 === 0) u1 = 1e-9;
  const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
  return mean + z * stdDev;
};

const runMonteCarloSimulation = ({
  currentAge, retirementAge, lifeExpectancy, totalAssets, monthlySavings,
  monthlyExpenseAtRetirement, postRetInflation, lifestylePct,
  equityWeight, debtWeight, otherWeight,
  equityMean, equityStdDev, debtMean, debtStdDev, otherMean, otherStdDev,
  simulations = 500,
}) => {
  const yearsToRet = Math.max(retirementAge - currentAge, 0);
  const yearsInRet = Math.max(lifeExpectancy - retirementAge, 1);
  const totalYears = yearsToRet + yearsInRet;
  let successCount = 0;
  const allPaths = [];

  for (let sim = 0; sim < simulations; sim++) {
    let corpus = totalAssets;
    let expense = monthlyExpenseAtRetirement * 12 * (lifestylePct / 100);
    const path = [Math.round(corpus)];
    let failed = false;

    for (let y = 1; y <= totalYears; y++) {
      const eqReturn = randomNormal(equityMean, equityStdDev) / 100;
      const debtReturn = randomNormal(debtMean, debtStdDev) / 100;
      const otherReturn = randomNormal(otherMean, otherStdDev) / 100;
      const portReturn = equityWeight * eqReturn + debtWeight * debtReturn + otherWeight * otherReturn;

      if (y <= yearsToRet) {
        corpus = corpus * (1 + portReturn) + monthlySavings * 12;
      } else {
        corpus = corpus * (1 + portReturn) - expense;
        expense *= (1 + postRetInflation / 100);
        if (corpus <= 0) { failed = true; corpus = 0; }
      }
      path.push(Math.round(Math.max(0, corpus)));
    }
    if (!failed) successCount++;
    allPaths.push(path);
  }

  const probabilityOfSuccess = simulations > 0 ? (successCount / simulations) * 100 : 0;

  const percentileBands = [];
  for (let y = 0; y <= totalYears; y++) {
    const valuesAtYear = allPaths.map((p) => p[y]).sort((a, b) => a - b);
    const pIdx = (p) => valuesAtYear[Math.min(simulations - 1, Math.max(0, Math.floor(simulations * p)))];
    percentileBands.push({
      year: y, age: currentAge + y,
      p10: pIdx(0.10), p50: pIdx(0.50), p90: pIdx(0.90),
    });
  }

  return { probabilityOfSuccess, percentileBands, simulations, yearsToRet, totalYears };
};

// Best-effort match of auto-generated per-child goals (see generateFamilyGoals) back to each child,
// so the print report can build dedicated Education/Marriage sections per child.
const groupGoalsByChild = (goalCalcs, family) => {
  if (!family || !family.children) return [];
  return family.children
    .filter((c) => c.name)
    .map((c) => {
      const prefix = `${c.name}'s`;
      const mine = goalCalcs.filter((g) => g.name.startsWith(prefix));
      const graduation = mine.find((g) => /graduation(?!.*post)/i.test(g.name)) || null;
      const postGraduation = mine.find((g) => /post-graduation/i.test(g.name)) || null;
      const marriage = mine.find((g) => /wedding|marriage/i.test(g.name)) || null;
      return { child: c, graduation, postGraduation, marriage, other: mine.filter((g) => ![graduation, postGraduation, marriage].includes(g)) };
    });
};

function Field({ label, value, onChange, suffix, step = 1, min = 0, type = "number", disabled = false, live = false }) {

          step={step}

          }}

        {suffix && <span className="field-suffix">{suffix}</span>}

}

function StatCard({ label, value, tone = "navy", sub }) {

function GapBar({ have, need, label }) {

// ---- Plain-SVG chart primitives used only by the print report (no chart library dependency,
// so the exported PDF looks identical whether generated from the Claude artifact or the
// standalone HTML file). ----
function MiniDonutSVG({ segments, size = 120, centerLabel, centerSub }) {
  const total = segments.reduce((s, x) => s + Math.max(0, x.value), 0) || 1;
  const r = size / 2 - 10;
  const cx = size / 2, cy = size / 2;
  const circ = 2 * Math.PI * r;
  let offset = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="#EAE4D6" strokeWidth="14" />
      {segments.map((s, i) => {
        const frac = Math.max(0, s.value) / total;
        const dash = frac * circ;
        const el = (
          <circle
            key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.color} strokeWidth="14"
            strokeDasharray={`${dash} ${circ - dash}`} strokeDashoffset={-offset}
            transform={`rotate(-90 ${cx} ${cy})`} strokeLinecap="butt"
          />
        );
        offset += dash;
        return el;
      })}
      {centerLabel && (
        <text x={cx} y={cy - (centerSub ? 4 : -4)} textAnchor="middle" fontSize="15" fontWeight="700" fill="#0F2A4A">{centerLabel}</text>
      )}
      {centerSub && <text x={cx} y={cy + 14} textAnchor="middle" fontSize="9" fill="#6B7A8D">{centerSub}</text>}
    </svg>
  );
}

function MiniTrendSVG({ data, xKey, series, height = 180, width = 560 }) {
  const pad = { l: 46, r: 10, t: 10, b: 22 };
  const xs = data.map((d) => d[xKey]);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  let minY = 0, maxY = 1;
  series.forEach((s) => {
    data.forEach((d) => {
      maxY = Math.max(maxY, d[s.key]);
      minY = Math.min(minY, d[s.key]);
    });
  });
  const yRange = maxY - minY || 1;
  const xScale = (v) => pad.l + ((v - minX) / (maxX - minX || 1)) * (width - pad.l - pad.r);
  const yScale = (v) => height - pad.b - ((v - minY) / yRange) * (height - pad.t - pad.b);
  const zeroY = yScale(0);
  const step = Math.max(1, Math.round(data.length / 6));
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`}>
      {minY < 0 && <line x1={pad.l} x2={width - pad.r} y1={zeroY} y2={zeroY} stroke="#C1443C" strokeDasharray="3 3" />}
      {data.map((d, i) => (i % step === 0 ? (
        <text key={i} x={xScale(d[xKey])} y={height - 6} textAnchor="middle" fontSize="9.5" fill="#6B7A8D">{d[xKey]}</text>
      ) : null))}
      {[minY, (minY + maxY) / 2, maxY].map((v, i) => (
        <text key={i} x={pad.l - 6} y={yScale(v) + 3} textAnchor="end" fontSize="9" fill="#6B7A8D">{formatINR(v)}</text>
      ))}
      {series.map((s, si) => {
        const pts = data.map((d) => [xScale(d[xKey]), yScale(d[s.key])]);
        const path = "M " + pts.map((p) => p.join(",")).join(" L ");
        return <path key={si} d={path} fill="none" stroke={s.color} strokeWidth="2" />;
      })}
    </svg>
  );
}

function MiniBarRow({ label, value, max, color }) {
  const pct = max > 0 ? Math.min(100, (value / max) * 100) : 0;
  return (
    <div className="mini-bar-row">

      <span className="mini-bar-value">{formatINR(value, false)}</span>
    </div>
  );
}

// "Cone of uncertainty" fan chart: shades the 10th-90th percentile range across all simulated
// trials, with the median path drawn as a solid line -- the standard visual for Monte Carlo output.
const niceMax = (v) => {
  if (!isFinite(v) || v <= 0) return 1;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const norm = v / mag;
  const nice = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
  return nice * mag;
};
const buildScale = (domain, range) => {
  const span = domain[1] - domain[0] || 1;
  return (v) => range[0] + ((v - domain[0]) / span) * (range[1] - range[0]);
};

function FanChartSVG({ data, xKey = "age", height = 340, retirementAge }) {
  const W = 700;
  const pad = { l: 64, r: 20, t: 16, b: 32 };
  const xs = data.map((d) => d[xKey]);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const maxY = niceMax(Math.max(...data.map((d) => d.p90), 1));
  const xScale = buildScale([minX, maxX], [pad.l, W - pad.r]);
  const yScale = buildScale([0, maxY], [height - pad.b, pad.t]);
  const step = Math.max(1, Math.round(data.length / 8));

  const topPts = data.map((d) => [xScale(d[xKey]), yScale(d.p90)]);
  const botPts = [...data].reverse().map((d) => [xScale(d[xKey]), yScale(d.p10)]);
  const bandPath = "M " + topPts.map((p) => p.join(",")).join(" L ") + " L " + botPts.map((p) => p.join(",")).join(" L ") + " Z";
  const medianPath = "M " + data.map((d) => [xScale(d[xKey]), yScale(d.p50)].join(",")).join(" L ");

  return (
    <svg viewBox={`0 0 ${W} ${height}`} width="100%">
      {[0, 0.25, 0.5, 0.75, 1].map((f, i) => {
        const val = maxY * f, y = yScale(val);
        return (
          <g key={i}>
            <line x1={pad.l} x2={W - pad.r} y1={y} y2={y} stroke="var(--grid-line)" strokeDasharray="3 3" />
            <text x={pad.l - 8} y={y + 4} textAnchor="end" fontSize="11" fill="var(--text-muted)">{formatINR(val)}</text>
          </g>
        );
      })}
      {data.map((d, i) => (i % step === 0 ? (
        <text key={i} x={xScale(d[xKey])} y={height - 6} textAnchor="middle" fontSize="11" fill="var(--text-muted)">{d[xKey]}</text>
      ) : null))}
      {retirementAge != null && (
        <line x1={xScale(retirementAge)} x2={xScale(retirementAge)} y1={pad.t} y2={height - pad.b} stroke="var(--navy)" strokeDasharray="4 4" />
      )}
      <path d={bandPath} fill="var(--orange)" fillOpacity="0.18" stroke="none" />
      <path d={medianPath} fill="none" stroke="var(--orange)" strokeWidth="2.5" />
    </svg>
  );
}

function WealthBlueprint() {

  const [tax, setTax] = useState(defaultTax);
  const [investLink, setInvestLink] = useState(null);

  const [savedClients, setSavedClients] = useState([]);
  const [selectedClient, setSelectedClient] = useState("");
  const [storageStatus, setStorageStatus] = useState({ type: "idle", msg: "" });
  const [confirmDelete, setConfirmDelete] = useState(false);

  const flashStatus = (type, msg, ms = 2800) => {
    setStorageStatus({ type, msg });
    setTimeout(() => setStorageStatus({ type: "idle", msg: "" }), ms);
  };

  const refreshClientList = async () => {
    if (typeof window === "undefined" || !window.storage) return;
    try {
      const result = await window.storage.list("client:", false);
      setSavedClients(result && result.keys ? result.keys.map((k) => k.replace(/^client:/, "")).sort() : []);
    } catch (e) {
      setSavedClients([]);
    }
  };

  useEffect(() => {
    refreshClientList();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const handleSaveClient = async () => {
    const name = (profile.name || "").trim();
    if (!name) { flashStatus("error", "Enter a client name on the Profile tab first."); return; }
    if (typeof window === "undefined" || !window.storage) { flashStatus("error", "Storage isn't available in this context."); return; }
    setStorageStatus({ type: "saving", msg: "Saving…" });
    try {
      const payload = JSON.stringify({ profile, assets, insurance, goals, family, liabilities, riskProfile, budget, tax, savedAt: Date.now() });
      const result = await window.storage.set(`client:${name}`, payload, false);
      if (result) {
        setSelectedClient(name);
        await refreshClientList();
        flashStatus("success", `Saved "${name}".`);
      } else {
        flashStatus("error", "Save failed — try again.");
      }
    } catch (e) {
      flashStatus("error", "Save failed — try again.");
    }
  };

  const handleLoadClient = async (name) => {
    if (!name) { setSelectedClient(""); return; }
    if (typeof window === "undefined" || !window.storage) { flashStatus("error", "Storage isn't available in this context."); return; }
    setStorageStatus({ type: "loading", msg: "Loading…" });
    try {
      const result = await window.storage.get(`client:${name}`, false);
      if (result && result.value) {
        const data = JSON.parse(result.value);
        if (data.profile) setProfile(data.profile);
        if (data.assets) setAssets(data.assets);
        if (data.insurance) setInsurance(data.insurance);
        if (data.goals) setGoals(data.goals);
        if (data.family) setFamily(data.family); else setFamily(defaultFamily);
        if (data.liabilities) setLiabilities(data.liabilities); else setLiabilities(defaultLiabilities);
        if (data.riskProfile) setRiskProfile(data.riskProfile); else setRiskProfile(defaultRiskProfile);
        if (data.budget) setBudget(data.budget); else setBudget(defaultBudget);
        if (data.tax) setTax(data.tax); else setTax(defaultTax);
        setSelectedClient(name);
        setInvestLink(null);
        setActive("profile");
        flashStatus("success", `Loaded "${name}".`);
      }
    } catch (e) {
      flashStatus("error", "Couldn't load that client.");
    }
  };

  const handleNewClient = () => {
    setProfile(defaultProfile);
    setAssets(defaultAssets);
    setInsurance(defaultInsurance);
    setGoals(defaultGoals);
    setFamily(defaultFamily);
    setLiabilities(defaultLiabilities);
    setRiskProfile(defaultRiskProfile);
    setBudget(defaultBudget);
    setTax(defaultTax);
    setSelectedClient("");
    setInvestLink(null);
    setConfirmDelete(false);
    setActive("profile");
  };

  const handleDeleteClient = async () => {
    if (!selectedClient) return;
    if (!confirmDelete) { setConfirmDelete(true); setTimeout(() => setConfirmDelete(false), 3000); return; }

      await window.storage.delete(`client:${selectedClient}`, false);
      await refreshClientList();
      handleNewClient();
      flashStatus("success", "Deleted.");

      try {

  const handlePrint = () => {

  const setP = (k) => (v) => setProfile((s) => ({ ...s, [k]: v }));

  const setI = (k) => (v) => setInsurance((s) => ({ ...s, [k]: v }));

  const updateGoal = (id, patch) => setGoals((gs) => gs.map((g) => (g.id === id ? { ...g, ...patch } : g)));
  const removeGoal = (id) => setGoals((gs) => gs.filter((g) => g.id !== id));
  const addGoal = (type = "other") => {

    setGoals((gs) => [
      ...gs,
      { id: Date.now(), name: def.label, type, yearsFromNow: def.years, currentCost: def.cost, inflation: def.inflation, rate: def.rate },

  const generateFamilyGoals = () => {

    if (newGoals.length) setGoals((gs) => [...gs, ...newGoals]);

  const updateLiability = (id, patch) => setLiabilities((ls) => ls.map((l) => (l.id === id ? { ...l, ...patch } : l)));

  const goalCalcs = useMemo(() => {
    return goals.map((g) => {
      const rate = g.rate != null ? g.rate : goalReturnRate(g.yearsFromNow, profile.equityReturn, profile.debtReturn);
      const infl = g.inflation != null ? g.inflation : profile.inflation;
      const futureCost = fvLumpsum(g.currentCost, infl, g.yearsFromNow);
      const sip = requiredSIP(futureCost, rate, g.yearsFromNow);
      return { ...g, rate, inflation: infl, futureCost, sip };
    });
  }, [goals, profile.inflation, profile.equityReturn, profile.debtReturn]);

  const totalGoalSIP = goalCalcs.reduce((s, g) => s + g.sip, 0);

  const retirementCalc = useMemo(() => {
    const yearsToRet = Math.max(profile.retirementAge - profile.currentAge, 0);
    const retDuration = Math.max(profile.lifeExpectancy - profile.retirementAge, 1);
    const annualExpenseToday = profile.monthlyExpenses * 12 * (profile.lifestylePct / 100);
    const expenseAtRetirement = fvLumpsum(annualExpenseToday, profile.preRetInflation, yearsToRet);
    const corpusForExpenses = pvGrowingAnnuity(expenseAtRetirement, profile.postRetReturn, profile.postRetInflation, retDuration);
    const estatePV = profile.estateValue > 0 ? profile.estateValue / Math.pow(1 + profile.postRetReturn / 100, retDuration) : 0;
    const requiredCorpus = corpusForExpenses + estatePV;

    const fvEquity = fvLumpsum(assets.equity, profile.equityReturn, yearsToRet);
    const fvDebt = fvLumpsum(assets.debt, profile.debtReturn, yearsToRet);
    const fvGold = fvLumpsum(assets.gold, 8, yearsToRet);
    const fvRE = fvLumpsum(assets.realEstate, 7, yearsToRet);
    const fvCash = fvLumpsum(assets.cash, 3.5, yearsToRet);
    const projectedCorpus = fvEquity + fvDebt + fvGold + fvRE + fvCash;

    const gap = Math.max(0, requiredCorpus - projectedCorpus);
    const requiredSIPForGap = requiredSIP(gap, profile.equityReturn, yearsToRet);
    // Alternative strategy: same shortfall closed with a step-up SIP instead of a level one.
    const stepUpSIPForGap = (() => {
      if (gap <= 0) return 0;
      const r = monthlyRate(profile.equityReturn);
      const n = Math.round(yearsToRet * 12);
      const g10 = 0.10;
      if (n <= 0) return gap;
      // Solve iteratively for starting monthly SIP with 10% annual step-up reaching `gap` in n months.
      let lo = 0, hi = gap;
      for (let i = 0; i < 60; i++) {
        const mid = (lo + hi) / 2;
        const fv = (() => {
          let pmt = mid, corpus = 0;
          for (let m = 1; m <= n; m++) {
            corpus = (corpus + pmt) * (1 + r);
            if (m % 12 === 0) pmt = pmt * (1 + g10);
          }
          return corpus;
        })();
        if (fv > gap) hi = mid; else lo = mid;
      }
      return (lo + hi) / 2;
    })();

    return {
      yearsToRet, retDuration, expenseAtRetirement, requiredCorpus, corpusForExpenses, estatePV,
      projectedCorpus, gap, requiredSIPForGap, stepUpSIPForGap,
    };
  }, [profile, assets]);

  const insuranceCalc = useMemo(() => {
    const hasSpouse = family.spouseAge !== "" && family.spouseAge != null && !isNaN(parseFloat(family.spouseAge));
    const spouseAge = hasSpouse ? parseFloat(family.spouseAge) : null;
    const horizon = hasSpouse
      ? Math.max(0, insurance.spouseLifeExpectancy - spouseAge)
      : Math.max(0, profile.retirementAge - profile.currentAge);
    const familyNeedPV = pvGrowingAnnuity(profile.monthlyExpenses * 12, insurance.claimReturn, profile.inflation, horizon);
    const requiredLife = Math.max(
      0,
      familyNeedPV + insurance.outstandingLoans - insurance.existingLife - assets.cash
    );
    const annualIncome = profile.monthlyIncome * 12;
    const recommendedHealth = Math.max(1000000, Math.round((annualIncome * 0.3) / 100000) * 100000);
    const healthGap = Math.max(0, recommendedHealth - insurance.existingHealth);
    return { requiredLife, recommendedHealth, healthGap, familyNeedPV, horizon, hasSpouse, method: hasSpouse ? "spouse" : "retirement" };
  }, [profile, insurance, assets, family]);

  const wealthCurve = useMemo(() => {
    const rEq = profile.equityReturn / 100, rDebt = profile.debtReturn / 100;
    const rGold = 0.08, rRE = 0.07, rCash = 0.035;
    const blended =
      totalAssets > 0
        ? (assets.equity * rEq + assets.debt * rDebt + assets.gold * rGold + assets.realEstate * rRE + assets.cash * rCash) /
          totalAssets
        : rEq;
    const postInfl = profile.postRetInflation / 100;
    let corpus = totalAssets;
    const data = [];
    const totalYears = Math.max(profile.lifeExpectancy - profile.currentAge, 1);
    const sortedGoals = [...goalCalcs].sort((a, b) => a.yearsFromNow - b.yearsFromNow);
    let depletedAge = null;

    for (let y = 0; y <= totalYears; y++) {
      const age = profile.currentAge + y;
      if (y > 0) {
        if (age <= profile.retirementAge) {
          corpus = corpus * (1 + blended) + profile.existingMonthlySavings * 12 * (1 + blended / 2);
        } else {
          const yearsIntoRetirement = age - profile.retirementAge;
          const expense = profile.monthlyExpenses * 12 * (profile.lifestylePct / 100) * Math.pow(1 + postInfl, yearsIntoRetirement);
          corpus = corpus * (1 + profile.postRetReturn / 100) - expense;
        }
        sortedGoals.forEach((g) => {
          if (Math.round(g.yearsFromNow) === y) corpus -= g.futureCost;
        });
        if (corpus <= 0 && depletedAge === null && age > profile.retirementAge) depletedAge = age;
      }
      data.push({ age, corpus: Math.round(Math.max(0, corpus)) });
    }
    return { data, depletedAge, blended };
  }, [profile, assets, goalCalcs, totalAssets]);

  const netWorthCalc = useMemo(() => {
    const totalLiabilities = liabilities.reduce((s, l) => s + (parseFloat(l.outstanding) || 0), 0);
    const totalLiabEMI = liabilities.reduce((s, l) => s + (parseFloat(l.emiMonthly) || 0), 0);
    const netWorth = totalAssets - totalLiabilities;
    const byType = {};
    liabilities.forEach((l) => { byType[l.type] = (byType[l.type] || 0) + (parseFloat(l.outstanding) || 0); });
    return { totalLiabilities, totalLiabEMI, netWorth, byType };
  }, [liabilities, totalAssets]);

  const riskCalc = useMemo(() => {
    const answered = RISK_QUESTIONS.filter((q) => riskProfile.answers[q.key] != null);
    const score = answered.reduce((s, q) => s + riskProfile.answers[q.key], 0);
    const maxPossible = RISK_QUESTIONS.length * 4;
    const minPossible = RISK_QUESTIONS.length * 1;
    const isComplete = answered.length === RISK_QUESTIONS.length;
    const band = isComplete ? (RISK_BANDS.find((b) => score <= b.max) || RISK_BANDS[RISK_BANDS.length - 1]) : null;
    return { score, maxPossible, minPossible, isComplete, answeredCount: answered.length, band };
  }, [riskProfile]);

  const budgetCalc = useMemo(() => {
    const categorizedTotal = (parseFloat(budget.household) || 0) + (parseFloat(budget.insurancePremium) || 0)
      + (parseFloat(budget.investments) || 0) + (parseFloat(budget.discretionary) || 0) + (parseFloat(budget.other) || 0);
    const reconciled = Math.abs(categorizedTotal - profile.monthlyExpenses) < 100;
    const savingsRatio = profile.monthlyIncome > 0 ? (profile.existingMonthlySavings / profile.monthlyIncome) * 100 : 0;
    const debtToIncomeRatio = profile.monthlyIncome > 0 ? (profile.monthlyEMI / profile.monthlyIncome) * 100 : 0;
    const liquidAssets = assets.cash + assets.debt;
    const liquidityRatioMonths = profile.monthlyExpenses > 0 ? liquidAssets / profile.monthlyExpenses : 0;
    return { categorizedTotal, reconciled, savingsRatio, debtToIncomeRatio, liquidAssets, liquidityRatioMonths };
  }, [budget, profile, assets]);

  const taxCalc = useMemo(() => {
    const grossAnnual = profile.monthlyIncome * 12 + (parseFloat(tax.otherIncome) || 0);
    const basicSalary = grossAnnual * 0.5;
    const hraReceived = basicSalary * 0.4;
    const rentPaid = parseFloat(tax.hraRentPaid) || 0;
    const hraExemption = tax.isSalaried && rentPaid > 0
      ? Math.max(0, Math.min(hraReceived, Math.max(0, rentPaid - 0.1 * basicSalary), (tax.hraCityMetro ? 0.5 : 0.4) * basicSalary))
      : 0;

    const c80C = Math.min(parseFloat(tax.section80C) || 0, 150000);
    const c80D = Math.min(parseFloat(tax.section80D) || 0, 25000);
    const homeLoanInt = Math.min(parseFloat(tax.homeLoanInterest) || 0, 200000);
    const nps1B = Math.min(parseFloat(tax.nps80CCD1B) || 0, 50000);
    const totalOldDeductions = c80C + c80D + homeLoanInt + nps1B + hraExemption;

    const oldStdDed = tax.isSalaried ? 50000 : 0;
    const oldTaxable = Math.max(0, grossAnnual - oldStdDed - totalOldDeductions);
    const oldRegime = computeSlabTax(oldTaxable, [[250000, 0], [500000, 0.05], [1000000, 0.20], [Infinity, 0.30]], 500000, 12500);

    const newStdDed = tax.isSalaried ? 75000 : 0;
    const newTaxable = Math.max(0, grossAnnual - newStdDed);
    const newRegime = computeSlabTax(newTaxable, [[400000, 0], [800000, 0.05], [1200000, 0.10], [1600000, 0.15], [2000000, 0.20], [2400000, 0.25], [Infinity, 0.30]], 1200000, 60000);

    const recommended = newRegime.totalTax <= oldRegime.totalTax ? "new" : "old";
    const savings = Math.abs(newRegime.totalTax - oldRegime.totalTax);

    return { grossAnnual, hraExemption, c80C, c80D, homeLoanInt, nps1B, totalOldDeductions, oldRegime, newRegime, recommended, savings };
  }, [profile, tax]);

  const savingsCheck = profile.monthlyIncome - profile.monthlyExpenses - profile.monthlyEMI;
  const totalMonthlyRequired = totalGoalSIP + retirementCalc.requiredSIPForGap;
  const monthlyShortfall = totalMonthlyRequired - profile.existingMonthlySavings;
  const retirementReadiness = retirementCalc.requiredCorpus > 0
    ? Math.min(100, (retirementCalc.projectedCorpus / retirementCalc.requiredCorpus) * 100)
    : 100;

  /* ---------------- RENDER ---------------- */

  return (
    <>
    <div className="wb-root">
      <style>{CSS}</style>

      <aside className="wb-sidebar">
        <div className="wb-brand">
          <div className="wb-brand-mark">HF</div>
          <div>
            <div className="wb-brand-name">Wealth Blueprint</div>
            <div className="wb-brand-sub">Hetal Finserv &middot; Financial Planning</div>
          </div>
        </div>

        <div className="wb-client-switcher">
          <label className="wcs-label">Saved Clients</label>
          <select className="wcs-select" value={selectedClient} onChange={(e) => handleLoadClient(e.target.value)}>
            <option value="">{savedClients.length ? "Select a client…" : "No saved clients yet"}</option>
            {savedClients.map((name) => (
              <option key={name} value={name}>{name}</option>
            ))}
          </select>
          <div className="wcs-actions">
            <button className="wcs-btn" onClick={handleSaveClient}><Save size={13} /> Save</button>
            <button className="wcs-btn" onClick={handleNewClient}><Plus size={13} /> New</button>
          </div>
          {selectedClient && (
            <button className="wcs-delete" onClick={handleDeleteClient}>
              {confirmDelete ? "Click again to confirm" : `Delete "${selectedClient}"`}
            </button>
          )}
          {storageStatus.type !== "idle" && (
            <div className={`wcs-status wcs-status-${storageStatus.type}`}>{storageStatus.msg}</div>
          )}
          <div className="wcs-actions" style={{ marginTop: 2 }}>
            <button className="wcs-btn wcs-btn-secondary" onClick={handleExport}><Download size={13} /> Export</button>
            <button className="wcs-btn wcs-btn-secondary" onClick={handleImportClick}><Upload size={13} /> Import</button>
          </div>
          <input ref={importFileRef} type="file" accept="application/json" style={{ display: "none" }} onChange={handleImportFile} />
          <button className="wcs-print-btn" onClick={handlePrint}><Printer size={14} /> Print / Save as PDF</button>
        </div>

        <nav className="wb-nav">
          {TABS.map((t) => {
            const Icon = t.icon;
            return (
              <button
                key={t.key}
                className={`wb-nav-item ${active === t.key ? "is-active" : ""}`}
                onClick={() => setActive(t.key)}
              >
                <Icon size={18} strokeWidth={1.8} />
                <span>{t.label}</span>
              </button>
            );
          })}
        </nav>
        <div className="wb-sidebar-footer">
          <div className="wb-mini-stat">
            <span>Client</span>
            <strong>{profile.name || "Unnamed"}</strong>
          </div>
          <div className="wb-mini-stat">
            <span>Net Worth Today</span>
            <strong>{formatINR(totalAssets)}</strong>
          </div>
        </div>
      </aside>

      <main className="wb-main">
        {active === "profile" && (
          <ProfileTab profile={profile} setP={setP} assets={assets} setA={setA} savingsCheck={savingsCheck} totalAssets={totalAssets} family={family} setFamily={setFamily} />
        )}
        {active === "networth" && (
          <NetWorthTab assets={assets} liabilities={liabilities} updateLiability={updateLiability} removeLiability={removeLiability} addLiability={addLiability} netWorthCalc={netWorthCalc} totalAssets={totalAssets} />
        )}
        {active === "goals" && (
          <GoalsTab goalCalcs={goalCalcs} updateGoal={updateGoal} removeGoal={removeGoal} addGoal={addGoal} totalGoalSIP={totalGoalSIP} onOpenCalculator={(goalId) => openCalculator({ type: "goal", goalId })} family={family} generateFamilyGoals={generateFamilyGoals} />
        )}
        {active === "risk" && (
          <RiskProfileTab riskProfile={riskProfile} setRiskProfile={setRiskProfile} riskCalc={riskCalc} profile={profile} setP={setP} />
        )}
        {active === "invest" && (
          <InvestTab profile={profile} goalCalcs={goalCalcs} retirementCalc={retirementCalc} linkTarget={investLink} onClearLink={() => setInvestLink(null)} />
        )}
        {active === "retirement" && (
          <RetirementTab
            profile={profile} setP={setP} r={retirementCalc}
            onSimulateGap={() => openCalculator({ type: "retirement-gap" })}
            onStressTestSWP={() => openCalculator({ type: "retirement-swp" })}
          />
        )}
        {active === "insurance" && <InsuranceTab insurance={insurance} setI={setI} calc={insuranceCalc} family={family} />}
        {active === "cashflow" && (
          <CashFlowTab profile={profile} budget={budget} setBudget={setBudget} budgetCalc={budgetCalc} netWorthCalc={netWorthCalc} liabilities={liabilities} />
        )}
        {active === "tax" && (
          <TaxPlanningTab tax={tax} setTax={setTax} taxCalc={taxCalc} profile={profile} />
        )}
        {active === "wealth" && <WealthTab curve={wealthCurve} profile={profile} goalCalcs={goalCalcs} />}
        {active === "montecarlo" && (
          <MonteCarloTab profile={profile} assets={assets} totalAssets={totalAssets} retirementCalc={retirementCalc} />
        )}
        {active === "action" && (
          <ActionTab
            profile={profile}
            goalCalcs={goalCalcs}
            retirementCalc={retirementCalc}
            insuranceCalc={insuranceCalc}
            totalGoalSIP={totalGoalSIP}
            totalMonthlyRequired={totalMonthlyRequired}
            monthlyShortfall={monthlyShortfall}
            retirementReadiness={retirementReadiness}
            depletedAge={wealthCurve.depletedAge}
            onSimulateGap={() => openCalculator({ type: "retirement-gap" })}
            netWorthCalc={netWorthCalc}
            budgetCalc={budgetCalc}
            riskCalc={riskCalc}
          />
        )}
      </main>
    </div>

      <PrintReport
        profile={profile}
        assets={assets}
        insurance={insurance}
        family={family}
        totalAssets={totalAssets}
        goalCalcs={goalCalcs}
        totalGoalSIP={totalGoalSIP}
        retirementCalc={retirementCalc}
        insuranceCalc={insuranceCalc}
        totalMonthlyRequired={totalMonthlyRequired}
        monthlyShortfall={monthlyShortfall}
        retirementReadiness={retirementReadiness}
        depletedAge={wealthCurve.depletedAge}
        liabilities={liabilities}
        netWorthCalc={netWorthCalc}
        riskCalc={riskCalc}
        budgetCalc={budgetCalc}
        taxCalc={taxCalc}
      />
    </>
  );
}

          </div>

        {family && family.spouseName && (
          <div className="pr-box">
            <div className="pr-box-header pr-box-navy">SPOUSE DETAILS</div>
            <div className="pr-box-body">
              <div className="pr-kv-row"><span>Name of Spouse</span><strong>{family.spouseName}</strong></div>

            </div>

        {family && family.children && family.children.filter((c) => c.name).length > 0 && (
          <div className="pr-box">

            <div className="pr-box-body">
              {family.children.filter((c) => c.name).map((c, i) => (
                <div className="pr-kv-row" key={c.id}><span>{["1st", "2nd", "3rd", "4th", "5th"][i] || `${i + 1}th`} Child</span><strong>{c.name}, {c.age} years</strong></div>
              ))}
            </div>
          </div>
        )}

        <div className="pr-box">
          <div className="pr-box-header pr-box-gold">CERTIFIED FINANCIAL GOAL PLANNER DETAILS</div>
          <div className="pr-box-body">
            <div className="pr-kv-row"><span>Name</span><strong>Sandeep Dubal</strong></div>

            <div className="pr-kv-row"><span>Email ID</span><strong>info@hetalfinserv.com</strong></div>
          </div>
        </div>
      </section>

      {/* ============ PAGE 1.5: EXECUTIVE SUMMARY ============ */}
      <section className="pr-page">
        <PrPageHeader clientName={clientLabel} />
        <div className="pr-section-title">YOUR FINANCIAL PLAN AT A GLANCE</div>

        <div className="pr-hero-sip">
          <div className="pr-hero-sip-label">COMBINED MONTHLY SIP REQUIRED</div>

        </div>

        <p className="pr-narrative">
          This plan covers {clientLabel}'s complete financial picture &mdash; retirement, {goalCalcs.length > 0 ? `${goalCalcs.length} life goal${goalCalcs.length > 1 ? "s" : ""}, ` : ""}
          income protection, and health security. Based on today's savings and the assumptions detailed on the following pages, {clientLabel} needs a combined monthly investment
          of {formatINR(grandTotalSIP, false)} to fund everything captured in this report, starting now.
        </p>

        <div className="pr-section-title pr-section-title-sm" style={{ marginTop: 18 }}>WHAT THIS PLAN COVERS</div>
        <div className="pr-coverage-list">
          <div className="pr-coverage-row">
            <CheckCircle2 size={16} className="pr-coverage-icon-ok" />
            <span>Retirement &mdash; corpus of {formatINR(retirementCalc.requiredCorpus)} required by age {profile.retirementAge}</span>
          </div>
          <div className="pr-coverage-row">
            {goalCalcs.length > 0 ? <CheckCircle2 size={16} className="pr-coverage-icon-ok" /> : <AlertTriangle size={16} className="pr-coverage-icon-warn" />}
            <span>{goalCalcs.length > 0 ? `${goalCalcs.length} life goal${goalCalcs.length > 1 ? "s" : ""} planned, totalling ${formatINR(goalCalcs.reduce((s, g) => s + g.futureCost, 0))}` : "No life goals added yet"}</span>
          </div>

const INVEST_MODES = [
  { key: "sip", label: "SIP" },
  { key: "lumpsum", label: "Lumpsum" },
  { key: "combo", label: "SIP + Lumpsum" },
  { key: "stepup", label: "Step-up SIP" },
  { key: "lumpsumStepup", label: "Lumpsum + Step-up SIP" },
  { key: "swpFixed", label: "SWP – Fixed" },
  { key: "swpGrowing", label: "SWP – Growing" },
];

function InvestTab({ profile, goalCalcs, retirementCalc, linkTarget, onClearLink }) {
  const [mode, setMode] = useState("sip");
  const [rate, setRate] = useState(12);
  const [years, setYears] = useState(15);
  const [sipAmount, setSipAmount] = useState(20000);
  const [lumpsumAmount, setLumpsumAmount] = useState(500000);
  const [stepType, setStepType] = useState("percent");
  const [stepValue, setStepValue] = useState(10);

  const [swpCorpus, setSwpCorpus] = useState(5000000);
  const [swpWithdrawal, setSwpWithdrawal] = useState(30000);
  const [swpRate, setSwpRate] = useState(8);
  const [swpYears, setSwpYears] = useState(25);
  const [swpInflation, setSwpInflation] = useState(6);

  // Live-synced values: while a link is active, these track the source (goal/retirement)
  // on every render, instead of copying values once. Editing is disabled for linked fields;
  // "Unlink" hands control back to local state, seeded with the last synced numbers.
  const linkedValues = useMemo(() => {
    if (!linkTarget) return null;
    if (linkTarget.type === "goal" && goalCalcs) {
      const g = goalCalcs.find((x) => x.id === linkTarget.goalId);
      if (!g) return null;
      return { kind: "growth", mode: "sip", sip: g.sip, years: g.yearsFromNow, rate: g.rate };
    }
    if (linkTarget.type === "retirement-gap" && retirementCalc) {
      return { kind: "growth", mode: "sip", sip: retirementCalc.requiredSIPForGap, years: retirementCalc.yearsToRet, rate: profile.equityReturn };
    }
    if (linkTarget.type === "retirement-swp" && retirementCalc) {
      const LONGEVITY_AGE = 100; // illustrate survival well past life expectancy
      const extendedYears = Math.max(retirementCalc.retDuration, LONGEVITY_AGE - profile.retirementAge);
      return {
        kind: "swp", mode: "swpGrowing",
        corpus: retirementCalc.projectedCorpus,
        withdrawal: retirementCalc.expenseAtRetirement / 12, // already inflated to retirement age, not today's expense
        rate: profile.postRetReturn,
        years: extendedYears,
        inflation: profile.postRetInflation,
        lifeExpectancyYear: retirementCalc.retDuration,
        baseAge: profile.retirementAge,
      };
    }
    return null;
  }, [linkTarget, goalCalcs, retirementCalc, profile]);

  const isLinked = !!linkedValues;

  // Switch to the right calculator mode once per new link click (not on every plan edit).
  useEffect(() => {
    if (linkedValues) setMode(linkedValues.mode);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [linkTarget]);

  // Unlinking seeds local state with the last live values so nothing jumps when control hands back.
  const handleUnlink = () => {
    if (linkedValues) {
      if (linkedValues.kind === "growth") {
        setSipAmount(Math.round(linkedValues.sip));
        setYears(Math.max(1, Math.round(linkedValues.years)));
        setRate(Math.round(linkedValues.rate * 10) / 10);
      } else {
        setSwpCorpus(Math.round(linkedValues.corpus));
        setSwpWithdrawal(Math.round(linkedValues.withdrawal));
        setSwpRate(linkedValues.rate);
        setSwpYears(Math.max(1, Math.round(linkedValues.years)));
        setSwpInflation(linkedValues.inflation);
      }
    }
    onClearLink();
  };

  const linkBanner = useMemo(() => {
    if (!linkTarget) return null;
    if (linkTarget.type === "goal" && goalCalcs) {
      const g = goalCalcs.find((x) => x.id === linkTarget.goalId);
      if (!g) return null;
      return { title: `Live-synced to goal: ${g.name}`, detail: `Target: ${formatINR(g.futureCost)} in ${Math.round(g.yearsFromNow)} years — edit the goal and this updates automatically`, target: g.futureCost };
    }
    if (linkTarget.type === "retirement-gap" && retirementCalc) {
      return { title: "Live-synced to: Retirement shortfall", detail: `Extra corpus needed by retirement: ${formatINR(retirementCalc.gap)} — edit the Retirement tab and this updates automatically`, target: retirementCalc.gap };
    }
    if (linkTarget.type === "retirement-swp" && retirementCalc) {
      return { title: "Live-synced to: Retirement corpus stress-test", detail: `Corpus ${formatINR(retirementCalc.projectedCorpus)}, drawing down at ${formatINR(retirementCalc.expenseAtRetirement / 12, false)}/month (expenses already inflated to retirement age), simulated through age 100`, target: null };
    }
    return null;
  }, [linkTarget, goalCalcs, retirementCalc]);

  const isGrowthMode = ["sip", "lumpsum", "combo", "stepup", "lumpsumStepup"].includes(mode);
  const isSwpMode = ["swpFixed", "swpGrowing"].includes(mode);
  const isGrowthLinked = isLinked && linkedValues.kind === "growth" && mode === "sip";
  const isSwpLinked = isLinked && linkedValues.kind === "swp" && mode === "swpGrowing";

  const effSip = isGrowthLinked ? Math.round(linkedValues.sip) : sipAmount;
  const effYears = isGrowthLinked ? Math.round(linkedValues.years * 10) / 10 : years;
  const effRate = isGrowthLinked ? Math.round(linkedValues.rate * 10) / 10 : rate;

  const effSwpCorpus = isSwpLinked ? Math.round(linkedValues.corpus) : swpCorpus;
  const effSwpWithdrawal = isSwpLinked ? Math.round(linkedValues.withdrawal) : swpWithdrawal;
  const effSwpRate = isSwpLinked ? linkedValues.rate : swpRate;
  const effSwpYears = isSwpLinked ? Math.round(linkedValues.years) : swpYears;
  const effSwpInflation = isSwpLinked ? linkedValues.inflation : swpInflation;

  const growth = useMemo(() => {
    if (!isGrowthMode) return null;
    if (mode === "sip") return simulateGrowth({ sip: effSip, rate: effRate, years: effYears });
    if (mode === "lumpsum") return simulateGrowth({ lumpsum: lumpsumAmount, rate, years });
    if (mode === "combo") return simulateGrowth({ lumpsum: lumpsumAmount, sip: sipAmount, rate, years });
    if (mode === "stepup") return simulateGrowth({ sip: sipAmount, rate, years, stepType, stepValue });
    if (mode === "lumpsumStepup") return simulateGrowth({ lumpsum: lumpsumAmount, sip: sipAmount, rate, years, stepType, stepValue });
    return null;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [mode, effSip, effRate, effYears, lumpsumAmount, sipAmount, rate, years, stepType, stepValue, isGrowthMode]);

  const swp = useMemo(() => {
    if (!isSwpMode) return null;
    const baseAge = isSwpLinked ? linkedValues.baseAge : profile.currentAge;
    return simulateSWP({
      corpus: effSwpCorpus, initialWithdrawal: effSwpWithdrawal, rate: effSwpRate,
      years: effSwpYears, growing: mode === "swpGrowing", inflation: effSwpInflation, baseAge,
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [mode, effSwpCorpus, effSwpWithdrawal, effSwpRate, effSwpYears, effSwpInflation, isSwpMode, isSwpLinked]);

  const lifeExpMarker = isSwpLinked && linkedValues.lifeExpectancyYear != null
    ? { year: linkedValues.lifeExpectancyYear, age: linkedValues.baseAge + linkedValues.lifeExpectancyYear }
    : null;

  const survivalMessage = useMemo(() => {
    if (!isSwpLinked || !swp || !lifeExpMarker) return null;
    if (!swp.depletedYear) {
      return { tone: "good", text: `The corpus comfortably sustains withdrawals all the way to age 100 — well past the ${lifeExpMarker.age} life expectancy used elsewhere in this plan.` };
    }
    if (swp.depletedYear <= lifeExpMarker.year) {
      return { tone: "bad", text: `The corpus runs out at age ${Math.round((linkedValues.baseAge + swp.depletedYear) * 10) / 10}, before the ${lifeExpMarker.age} life expectancy — this needs to be closed.` };
    }
    return { tone: "warn", text: `The corpus lasts past the ${lifeExpMarker.age} life expectancy, but runs out around age ${Math.round((linkedValues.baseAge + swp.depletedYear) * 10) / 10} if the client lives longer — a longevity risk worth planning for.` };
  }, [isSwpLinked, swp, lifeExpMarker, linkedValues]);

  return (
    <div className="tab-body">
      <h1 className="tab-title">Mutual Fund Calculator</h1>
      <p className="tab-sub">Every way money goes in or comes out of a fund &mdash; modelled month by month, not just a single formula.</p>

      {linkBanner && (
        <div className="link-banner">
          <div>
            <div className="link-banner-title"><Calculator size={14} /> {linkBanner.title} <span className="live-badge">live</span></div>
            <div className="link-banner-detail">{linkBanner.detail}</div>
          </div>
          <button className="link-banner-clear" onClick={handleUnlink}>Unlink &amp; edit freely {"✕"}</button>
        </div>
      )}

      <div className="mode-tabs">
        {INVEST_MODES.map((m) => {
          const isDisabled = isLinked && m.key !== linkedValues.mode;
          return (
            <button
              key={m.key}
              className={`mode-tab ${mode === m.key ? "is-active" : ""} ${isDisabled ? "is-disabled" : ""}`}
              onClick={() => !isDisabled && setMode(m.key)}
              disabled={isDisabled}
            >
              {m.label}
            </button>
          );
        })}
      </div>

      {isGrowthMode && (
        <div className="grid-2" style={{ marginTop: 18 }}>
          <section className="panel">
            <h3 className="panel-title"><Calculator size={16} /> Inputs</h3>

            {(mode === "sip" || mode === "combo" || mode === "stepup" || mode === "lumpsumStepup") && (
              <Field
                label={(mode === "stepup" || mode === "lumpsumStepup") ? "Starting Monthly SIP" : "Monthly SIP Amount"}
                value={mode === "sip" ? effSip : sipAmount}
                onChange={setSipAmount}
                suffix="₹" step={1000}
                disabled={isGrowthLinked && mode === "sip"}
                live={isGrowthLinked && mode === "sip"}
              />
            )}
            {(mode === "lumpsum" || mode === "combo" || mode === "lumpsumStepup") && (
              <Field label="Lumpsum Amount" value={lumpsumAmount} onChange={setLumpsumAmount} suffix="₹" step={10000} />
            )}
            {(mode === "stepup" || mode === "lumpsumStepup") && (
              <div className="grid-2">
                <label className="field">
                  <span className="field-label">Step-up Type</span>
                  <div className="field-input-wrap">
                    <select value={stepType} onChange={(e) => setStepType(e.target.value)} style={{ border: "none", background: "transparent", width: "100%", fontFamily: "var(--font-mono)", fontSize: 14 }}>
                      <option value="percent">Annual % Increase</option>
                      <option value="amount">Fixed ₹ Increase</option>
                    </select>
                  </div>
                </label>
                <Field label={stepType === "percent" ? "Step-up % Every Year" : "Step-up Amount Every Year"} value={stepValue} onChange={setStepValue} suffix={stepType === "percent" ? "%" : "₹"} step={stepType === "percent" ? 1 : 500} />
              </div>
            )}
            <div className="grid-2">
              <Field label="Expected Return" value={mode === "sip" ? effRate : rate} onChange={setRate} suffix="%" step={0.5} disabled={isGrowthLinked && mode === "sip"} live={isGrowthLinked && mode === "sip"} />
              <Field label="Investment Duration" value={mode === "sip" ? effYears : years} onChange={setYears} suffix="yrs" disabled={isGrowthLinked && mode === "sip"} live={isGrowthLinked && mode === "sip"} />
            </div>
          </section>

          <section className="panel">
            <h3 className="panel-title"><TrendingUp size={16} /> Result</h3>
            <div className="stack-stats">
              <StatCard label="Total Invested" value={formatINR(growth.totalInvested)} tone="navy" />
              <StatCard label="Maturity Value" value={formatINR(growth.finalValue)} tone="gold" />
              <StatCard label="Wealth Gained" value={formatINR(growth.gain)} tone="green" />
            </div>
          </section>
        </div>
      )}

      {isGrowthMode && (
        <section className="panel" style={{ marginTop: 18 }}>
          <h3 className="panel-title"><TrendingUp size={16} /> Invested vs Value, Year by Year</h3>
          <ComposedChartSVG
            data={growth.data} xKey="year" barKey="invested" lineKey="value" height={300}
            barColor="var(--navy-mid)" lineColor="var(--orange)"
            targetY={linkBanner && linkBanner.target ? linkBanner.target : null}
          />
          <div className="invest-table">
            <table>
              <thead>
                <tr><th>Year</th><th>Invested</th><th>Value</th><th>Gain</th></tr>
              </thead>
              <tbody>
                {growth.data.filter((d) => d.year > 0).map((d) => (
                  <tr key={d.year}>
                    <td>{d.year}</td>
                    <td>{formatINR(d.invested)}</td>
                    <td>{formatINR(d.value)}</td>
                    <td className="accent">{formatINR(d.value - d.invested)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </section>
      )}

      {isSwpMode && (
        <>
          <div className="grid-2" style={{ marginTop: 18 }}>
            <section className="panel">
              <h3 className="panel-title"><Calculator size={16} /> Inputs</h3>
              <Field label="Starting Corpus" value={effSwpCorpus} onChange={setSwpCorpus} suffix="₹" step={100000} disabled={isSwpLinked} live={isSwpLinked} />
              <Field label={mode === "swpGrowing" ? "Starting Monthly Withdrawal" : "Monthly Withdrawal"} value={effSwpWithdrawal} onChange={setSwpWithdrawal} suffix="₹" step={1000} disabled={isSwpLinked} live={isSwpLinked} />
              <div className="grid-2">
                <Field label="Expected Return" value={effSwpRate} onChange={setSwpRate} suffix="%" step={0.5} disabled={isSwpLinked} live={isSwpLinked} />
                <Field label="Simulate For" value={effSwpYears} onChange={setSwpYears} suffix="yrs" disabled={isSwpLinked} live={isSwpLinked} />
              </div>
              {mode === "swpGrowing" && (
                <Field label="Annual Increase in Withdrawal (Inflation)" value={effSwpInflation} onChange={setSwpInflation} suffix="%" step={0.5} disabled={isSwpLinked} live={isSwpLinked} />
              )}
            </section>

            <section className="panel">
              <h3 className="panel-title"><TrendingUp size={16} /> Result</h3>
              <div className="stack-stats">
                <StatCard label="Total Withdrawn" value={formatINR(swp.totalWithdrawn)} tone="navy" />
                <StatCard label="Final Balance" value={formatINR(swp.finalBalance)} tone={swp.depletedYear ? "alert" : "green"} />
                <StatCard
                  label={swp.depletedYear ? "Corpus Runs Out At" : `Corpus Lasts Through Age ${isSwpLinked ? linkedValues.baseAge + effSwpYears : "-"}`}
                  value={swp.depletedYear ? `Age ${Math.round(((isSwpLinked ? linkedValues.baseAge : profile.currentAge) + swp.depletedYear) * 10) / 10}` : "No shortfall simulated"}
                  tone={swp.depletedYear ? "alert" : "green"}
                />
              </div>
            </section>
          </div>

          {survivalMessage && (
            <div className={`inline-note ${survivalMessage.tone === "good" ? "note-ok" : survivalMessage.tone === "bad" ? "note-warn" : "note-longevity"}`} style={{ marginTop: 16 }}>
              {survivalMessage.tone === "good" ? <CheckCircle2 size={14} /> : <AlertTriangle size={14} />}
              {survivalMessage.text}
            </div>
          )}

          <section className="panel" style={{ marginTop: 18 }}>
            <h3 className="panel-title"><TrendingDown size={16} /> Cash Flow &amp; Fund Status{isSwpLinked ? ", Age " + linkedValues.baseAge + " to " + (linkedValues.baseAge + effSwpYears) : " Over Time"}</h3>
            {swp.depletedYear && (
              <div className="inline-note note-warn" style={{ marginBottom: 14 }}>
                <AlertTriangle size={14} /> This withdrawal rate depletes the corpus {isSwpLinked ? `at age ${Math.round((linkedValues.baseAge + swp.depletedYear) * 10) / 10}` : `in year ${swp.depletedYear}`}.
                From then on the table below shows the shortfall &mdash; the amount needed each year that the corpus can no longer provide.
              </div>
            )}
            <AreaChartSVG
              data={swp.rows} xKey={isSwpLinked ? "age" : "year"} yKey="closing" height={300} lineColor="var(--navy)"
              refLinesX={lifeExpMarker ? [{ x: lifeExpMarker.age, color: "var(--gold)", label: "Life Expectancy" }] : []}
            />
            <div className="invest-table">
              <table>
                <thead>
                  <tr>
                    {isSwpLinked && <th>Age</th>}
                    <th>Year</th><th>Opening</th><th>Monthly W/D</th><th>Annual W/D</th><th>Closing</th><th>Shortfall</th>
                  </tr>
                </thead>
                <tbody>
                  {swp.rows.filter((rr) => rr.year > 0).map((rr) => (
                    <tr key={rr.year} className={rr.shortfall > 0 ? "row-shortfall" : lifeExpMarker && rr.year > lifeExpMarker.year ? "row-beyond-le" : ""}>
                      {isSwpLinked && <td>{rr.age}{lifeExpMarker && rr.year === lifeExpMarker.year ? " ← life exp." : ""}</td>}
                      <td>{rr.year}</td>
                      <td>{formatINR(rr.opening)}</td>
                      <td>{formatINR(rr.monthlyWithdrawal, false)}</td>
                      <td>{formatINR(rr.annualWithdrawn)}</td>
                      <td className={rr.closing === 0 ? "accent-alert" : ""}>{formatINR(rr.closing)}</td>
                      <td className={rr.shortfall > 0 ? "accent-alert" : ""}>{rr.shortfall > 0 ? formatINR(rr.shortfall) : "–"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            {lifeExpMarker && (
              <p className="panel-note">
                Rows after age {lifeExpMarker.age} (marked with the dashed gold line) illustrate what happens if the client lives beyond the
                {" "}{lifeExpMarker.age} life expectancy used in the Retirement tab &mdash; through age {linkedValues.baseAge + effSwpYears} either way.
              </p>
            )}
          </section>
        </>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   TAB: RISK PROFILER

function RiskProfileTab({ riskProfile, setRiskProfile, riskCalc, profile, setP }) {
  const setAnswer = (qKey, score) => setRiskProfile((rp) => ({ ...rp, answers: { ...rp.answers, [qKey]: score } }));
  const [applyMsg, setApplyMsg] = useState("");

  const applyToAssumptions = () => {
    if (!riskCalc.band) return;
    const blendedReturn = (riskCalc.band.equity / 100) * 12 + (riskCalc.band.debt / 100) * 7 + (riskCalc.band.gold / 100) * 8;
    setP("equityReturn")(12);
    setP("debtReturn")(7);
    setApplyMsg(`Recommended mix noted: ~${blendedReturn.toFixed(1)}% blended return at ${riskCalc.band.label} risk. Adjust individual asset returns on the Client & Assets tab if needed.`);
    setTimeout(() => setApplyMsg(""), 6000);
  };

  return (
    <div className="tab-body">
      <h1 className="tab-title">Risk Profiler</h1>
      <p className="tab-sub">Six questions that turn "how much risk can this client actually handle" from a guess into a number.</p>

      <section className="panel">
        <h3 className="panel-title"><Flag size={16} /> Questionnaire</h3>
        <div className="risk-question-list">
          {RISK_QUESTIONS.map((q) => (
            <div className="risk-question" key={q.key}>
              <div className="risk-question-text">{q.text}</div>
              <div className="risk-options">
                {q.options.map((opt) => (
                  <button
                    key={opt.label}
                    className={`risk-option-btn ${riskProfile.answers[q.key] === opt.score ? "is-selected" : ""}`}
                    onClick={() => setAnswer(q.key, opt.score)}
                  >
                    {opt.label}
                  </button>
                ))}
              </div>
            </div>
          ))}
        </div>
      </section>

      <section className="panel" style={{ marginTop: 18 }}>
        <h3 className="panel-title"><TrendingUp size={16} /> Result</h3>
        {!riskCalc.isComplete ? (
          <div className="inline-note note-warn">
            <AlertTriangle size={14} /> Answer all {RISK_QUESTIONS.length} questions to see the risk score ({riskCalc.answeredCount}/{RISK_QUESTIONS.length} done).
          </div>
        ) : (
          <>
            <div className="risk-result-banner" style={{ background: riskCalc.band.color }}>
              <div className="risk-result-label">Risk Category</div>
              <div className="risk-result-value">{riskCalc.band.label}</div>
              <div className="risk-result-score">Score: {riskCalc.score} / {riskCalc.maxPossible}</div>
            </div>
            <div className="grid-3" style={{ marginTop: 16 }}>
              <StatCard label="Suggested Equity" value={`${riskCalc.band.equity}%`} tone="navy" />
              <StatCard label="Suggested Debt" value={`${riskCalc.band.debt}%`} tone="gold" />
              <StatCard label="Suggested Gold" value={`${riskCalc.band.gold}%`} tone="orange" />
            </div>
            <button className="btn-link" style={{ marginTop: 16 }} onClick={applyToAssumptions}>
              <CheckCircle2 size={14} /> Note Recommended Allocation
            </button>
            {applyMsg && <div className="inline-note note-ok" style={{ marginTop: 12 }}>{applyMsg}</div>}
            <p className="panel-note" style={{ marginTop: 12 }}>
              This is a starting-point allocation based on standard risk-banding practice, not a substitute for full KYC risk assessment.
              Use it to sanity-check the return assumptions set on the Client &amp; Assets tab.
            </p>
          </>
        )}
      </section>
    </div>
  );
}

    { name: "Corpus Needed", value: r.requiredCorpus },

    <div className="tab-body">
      <h1 className="tab-title">Retirement Readiness</h1>

        {r.yearsToRet} years to retirement &middot; {r.retDuration}-year retirement horizon &middot; expenses inflate every year of it.
      </p>

      <div className="grid-4">
        <StatCard label="Corpus Required at Retirement" value={formatINR(r.requiredCorpus)} tone="navy" />
        <StatCard label="Projected from Current Assets" value={formatINR(r.projectedCorpus)} tone="gold" />
        <StatCard label="Shortfall" value={formatINR(r.gap)} tone={r.gap > 0 ? "alert" : "green"} />

        <div className="alt-strategy-note">
          <Sparkles size={14} />

          same corpus &mdash; lower to start, same destination.

        <button className="btn-link" onClick={onStressTestSWP}><TrendingDown size={14} /> Stress-test this corpus with an SWP</button>
      </div>

      <section className="panel" style={{ marginTop: 20 }}>
        <h3 className="panel-title"><TrendingUp size={16} /> Advanced Retirement Assumptions</h3>
        <div className="grid-4">
          <Field label="Pre-Retirement Inflation" value={profile.preRetInflation} onChange={setP("preRetInflation")} suffix="%" step={0.5} />

          <Field label="% of Lifestyle to Maintain" value={profile.lifestylePct} onChange={setP("lifestylePct")} suffix="%" step={5} />

        <p className="panel-note">
          Expenses can inflate at a different pace before vs after retirement. "% of Lifestyle" lets a client plan to spend less (or more) than
          today once retired. Estate/Bequest is a legacy amount the corpus should still hold at life expectancy, valued at that future date.
        </p>
        {profile.estateValue > 0 && (
          <div className="total-strip" style={{ marginTop: 10 }}>
            <span>Of the required corpus, reserved for the estate</span>
            <strong>{formatINR(r.estatePV)}</strong>
          </div>

      </section>

      <section className="panel" style={{ marginTop: 20 }}>
        <h3 className="panel-title"><PiggyBank size={16} /> Corpus: Required vs Projected</h3>
        <BarChartSVG data={chartData} xKey="name" yKey="value" height={260} colors={["var(--navy)", r.gap > 0 ? "var(--alert)" : "var(--green)"]} />
        <p className="panel-note">
          Required corpus assumes expenses of {formatINR(profile.monthlyExpenses * 12 * (profile.lifestylePct / 100))}/year at retirement's start
          (today's expenses adjusted to {profile.lifestylePct}% of current lifestyle), growing at {profile.preRetInflation}% until retirement and
          {" "}{profile.postRetInflation}% through retirement, drawn down over {r.retDuration} years at a {profile.postRetReturn}% post-retirement return.
        </p>
      </section>
    </div>
  );
}

            <StatCard

        <section className="panel">
          <h3 className="panel-title"><Heart size={16} /> Health Insurance</h3>
          <Field label="Existing Health Cover (Family Floater)" value={insurance.existingHealth} onChange={setI("existingHealth")} suffix="₹" step={50000} />
          <div className="stack-stats">
            <StatCard label="Recommended Base Cover" value={formatINR(calc.recommendedHealth)} tone="navy" />
            <StatCard
              label={calc.healthGap > 0 ? "Cover Gap" : "Adequately Covered"}
              value={formatINR(calc.healthGap)}
              tone={calc.healthGap > 0 ? "alert" : "green"}
            />
          </div>
          <p className="panel-note">
            Rule-of-thumb sizing based on income and rising healthcare inflation (typically 12&ndash;15% annually in India).

function CashFlowTab({ profile, budget, setBudget, budgetCalc, netWorthCalc, liabilities }) {
  const setB = (k) => (v) => setBudget((b) => ({ ...b, [k]: v }));
  const ratioTone = (val, good, warn) => (val >= good ? "green" : val >= warn ? "gold" : "alert");

  return (

          <StatCard label="Debt-to-Income" value={`${budgetCalc.debtToIncomeRatio.toFixed(0)}%`} tone={budgetCalc.debtToIncomeRatio <= 36 ? (budgetCalc.debtToIncomeRatio <= 20 ? "green" : "gold") : "alert"} sub="Healthy: under 36%" />
