/* ---------------------------------------------------------------
   TAB: MONTE CARLO SIMULATION
---------------------------------------------------------------- */

function MonteCarloTab({ profile, assets, totalAssets, retirementCalc }) {
  const [vol, setVol] = useState({ equityStdDev: 18, debtStdDev: 5, otherStdDev: 12 });
  const [result, setResult] = useState(null);
  const [running, setRunning] = useState(false);

  const weights = useMemo(() => {
    const otherAssets = assets.gold + assets.realEstate + assets.cash;
    const total = totalAssets > 0 ? totalAssets : 1;
    return {
      equityWeight: assets.equity / total,
      debtWeight: assets.debt / total,
      otherWeight: otherAssets / total,
    };
  }, [assets, totalAssets]);

  const setV = (k) => (v) => setVol((s) => ({ ...s, [k]: v }));

  const runSimulation = () => {
    setRunning(true);
    setTimeout(() => {
      const r = runMonteCarloSimulation({
        currentAge: profile.currentAge, retirementAge: profile.retirementAge, lifeExpectancy: profile.lifeExpectancy,
        totalAssets, monthlySavings: profile.existingMonthlySavings,
        monthlyExpenseAtRetirement: retirementCalc.expenseAtRetirement / 12, postRetInflation: profile.postRetInflation,
        lifestylePct: profile.lifestylePct,
        equityWeight: weights.equityWeight, debtWeight: weights.debtWeight, otherWeight: weights.otherWeight,
        equityMean: profile.equityReturn, equityStdDev: vol.equityStdDev,
        debtMean: profile.debtReturn, debtStdDev: vol.debtStdDev,
        otherMean: 8, otherStdDev: vol.otherStdDev,
        simulations: 500,
      });
      setResult(r);
      setRunning(false);
    }, 30);
  };

  const successTone = !result ? "navy" : result.probabilityOfSuccess >= 80 ? "green" : result.probabilityOfSuccess >= 60 ? "gold" : "alert";
  const successColor = !result ? "var(--navy)" : result.probabilityOfSuccess >= 80 ? "var(--green)" : result.probabilityOfSuccess >= 60 ? "var(--gold)" : "var(--alert)";

  return (
    <div className="tab-body">
      <h1 className="tab-title">Monte Carlo Simulation</h1>
      <p className="tab-sub">
        Every other tab assumes one fixed return, every year, forever. Markets don't work that way. This runs 500 randomized
        market scenarios and reports what fraction of them actually get the client through retirement.
      </p>

      <section className="panel">
        <h3 className="panel-title"><Activity size={16} /> Volatility Assumptions</h3>
        <p className="panel-note" style={{ marginTop: -4, marginBottom: 14 }}>
          Return assumptions come from the Client &amp; Assets tab. These are the year-to-year swings around that average &mdash;
          standard deviation, in the same units as the return. Defaults reflect typical long-run Indian market volatility.
        </p>
        <div className="grid-3">
          <Field label="Equity Volatility" value={vol.equityStdDev} onChange={setV("equityStdDev")} suffix="%" step={1} />
          <Field label="Debt Volatility" value={vol.debtStdDev} onChange={setV("debtStdDev")} suffix="%" step={0.5} />
          <Field label="Gold/Real Estate/Cash Volatility" value={vol.otherStdDev} onChange={setV("otherStdDev")} suffix="%" step={1} />
        </div>
        <div className="mc-weights-row">
          <span>Current portfolio mix used: </span>
          <strong>{(weights.equityWeight * 100).toFixed(0)}% Equity</strong> &middot;
          <strong> {(weights.debtWeight * 100).toFixed(0)}% Debt</strong> &middot;
          <strong> {(weights.otherWeight * 100).toFixed(0)}% Gold/RE/Cash</strong>
        </div>
        <button className="btn-add" onClick={runSimulation} disabled={running} style={{ marginTop: 14 }}>
          <Activity size={16} /> {running ? "Running 500 trials…" : result ? "Re-run Simulation" : "Run Simulation (500 trials)"}
        </button>
      </section>

      {result && (
        <>
          <div className="mc-result-banner" style={{ borderColor: successColor }}>
            <div className="mc-result-label">PROBABILITY OF PLAN SUCCESS</div>
            <div className="mc-result-value" style={{ color: successColor }}>{result.probabilityOfSuccess.toFixed(0)}%</div>
            <div className="mc-result-sub">
              of 500 simulated market scenarios, the corpus lasted through age {profile.lifeExpectancy} without running out
            </div>
          </div>

          <div className="grid-3" style={{ marginTop: 16 }}>
            <StatCard label="Simulations Run" value={result.simulations} tone="navy" />
            <StatCard label="Median Outcome at Life Expectancy" value={formatINR(result.percentileBands[result.percentileBands.length - 1].p50)} tone="gold" />
            <StatCard label="Worst 10% of Scenarios" value={formatINR(result.percentileBands[result.percentileBands.length - 1].p10)} tone="alert" />
          </div>

          <section className="panel" style={{ marginTop: 18 }}>
            <h3 className="panel-title"><TrendingUp size={16} /> Range of Outcomes ("Cone of Uncertainty")</h3>
            <FanChartSVG data={result.percentileBands} retirementAge={profile.retirementAge} />
            <div className="legend-row">
              <span><i className="dot" style={{ background: "var(--navy)" }} /> Retirement age</span>
              <span><i className="dot" style={{ background: "var(--orange)" }} /> Shaded band = middle 80% of outcomes, line = median</span>
            </div>
            <p className="panel-note">
              The shaded band shows where the corpus landed in 80% of simulated scenarios (10th to 90th percentile) at each age;
              the solid line is the median (typical) outcome. A wide band means the plan is sensitive to market timing.
            </p>
          </section>

          <div className={`inline-note ${successTone === "green" ? "note-ok" : successTone === "gold" ? "note-longevity" : "note-warn"}`} style={{ marginTop: 16 }}>
            {successTone === "green" ? <CheckCircle2 size={14} /> : <AlertTriangle size={14} />}
            {result.probabilityOfSuccess >= 80
              ? "This is generally considered a high-confidence plan. Most advisors treat 80%+ as comfortable, though it's not a guarantee."
              : result.probabilityOfSuccess >= 60
              ? "This plan has meaningful market risk. Consider increasing savings, working longer, or reducing planned retirement expenses."
              : "This plan fails in a large share of simulated scenarios. The gap needs to be addressed — see the Retirement tab for options."}
          </div>
        </>
      )}

      <p className="panel-note" style={{ marginTop: 18 }}>
        <strong>An honest caveat:</strong> "Probability of success" is a widely used but widely misunderstood number. It does not mean
        an 80% score gives an 80% chance of a comfortable retirement and a 20% chance of poverty &mdash; most "failures" in these models
        mean the plan needed a small mid-course correction (spend a little less, work a little longer), not financial ruin. Treat this
        as a stress-test signal, not a verdict, and re-run it whenever the client's numbers change materially.
      </p>
    </div>
  );
}

function RadialReadiness({ value, color }) {
  const r = 54;
  const circ = 2 * Math.PI * r;
  const offset = circ - (value / 100) * circ;
  return (
    <svg width="140" height="140" viewBox="0 0 140 140">
      <circle cx="70" cy="70" r={r} fill="none" stroke="var(--ring-track)" strokeWidth="12" />
      <circle
        cx="70" cy="70" r={r} fill="none" stroke={color} strokeWidth="12"
        strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round"
        transform="rotate(-90 70 70)"
      />
      <text x="70" y="66" textAnchor="middle" fontSize="26" fontWeight="700" fill="var(--navy)" fontFamily="var(--font-display)">
        {value.toFixed(0)}%
      </text>
      <text x="70" y="86" textAnchor="middle" fontSize="11" fill="var(--text-muted)">
        funded
      </text>
    </svg>
  );
}

/* Section structure */

.pr-grand-total-banner { display: flex; align-items: stretch; margin-top: 14px; border-radius: 12px; overflow: hidden; border: 3px solid #0F2A4A; box-shadow: 0 4px 14px rgba(15,42,74,0.2); }

/* Child cards (education / marriage) */

/* Closing page */

.wb-main { flex: 1; overflow-y: auto; padding: 32px 40px; max-height: 900px; }
.tab-body { max-width: 980px; }
.tab-title { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--navy-deep); margin: 0 0 6px; }
.tab-sub { color: var(--text-muted); font-size: 14px; margin: 0 0 24px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

.panel { background: #fff; border: 1px solid var(--grid-line); border-radius: 12px; padding: 22px; }
.panel.compact { padding: 18px; display: flex; flex-direction: column; justify-content: center; }
.panel-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--navy); margin: 0 0 14px; }

.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }

.field-suffix { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-left: 6px; }

.inline-note { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 10px 14px; border-radius: 8px; margin-top: 8px; line-height: 1.5; }
.note-warn { background: #FBEDEA; color: #9A3B2F; }
.note-ok { background: #E9F3EE; color: #245C42; }
.note-longevity { background: #FBF3E4; color: #7A5A1E; }
.invest-table tr.row-beyond-le { background: #FBF3E4; }
.invest-table tr.row-shortfall { background: #FBEDEA; }
.invest-table tr.row-shortfall td { color: #9A3B2F; }

.total-strip { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding: 12px 16px; background: var(--navy-deep); border-radius: 8px; color: #fff; }
.total-strip span { font-size: 12px; opacity: 0.75; }
.total-strip strong { font-family: var(--font-mono); font-size: 17px; }

.stat-card { border-radius: 10px; padding: 16px; background: #fff; border: 1px solid var(--grid-line); }
.stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
.stat-value { font-family: var(--font-mono); font-size: 20px; font-weight: 600; color: var(--navy-deep); }
.stat-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }
.tone-alert .stat-value { color: var(--alert); }
.tone-green .stat-value { color: var(--green); }
.tone-orange .stat-value { color: var(--orange); }
.tone-gold .stat-value { color: #A8802E; }
.stack-stats { display: grid; gap: 10px; margin: 14px 0; }

.goal-list { display: flex; flex-direction: column; gap: 14px; }
.goal-card { background: #fff; border: 1px solid var(--grid-line); border-radius: 12px; padding: 18px 20px; }
.goal-card-head { display: flex; align-items: center; gap: 10px; }

.goal-results { display: flex; align-items: center; gap: 16px; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--grid-line); flex-wrap: wrap; }

.goal-arrow { color: var(--text-muted); }
.goal-rate-tag { margin-left: auto; font-size: 11px; color: var(--text-muted); background: var(--cream); padding: 4px 10px; border-radius: 20px; }

.add-goal-row { display: flex; gap: 10px; margin-bottom: 18px; }
.add-goal-select { flex: 1; max-width: 320px; border: 1.5px solid var(--grid-line); border-radius: 8px; padding: 10px 12px; font-size: 13px; font-family: var(--font-body); background: #FDFBF7; color: var(--text-main); }

.tax-winner-badge { font-size: 9.5px; font-weight: 700; background: var(--green); color: #fff; padding: 3px 9px; border-radius: 10px; margin-left: 8px; vertical-align: middle; letter-spacing: 0.03em; }

.mc-weights-row { margin-top: 12px; padding: 10px 14px; background: var(--cream); border-radius: 8px; font-size: 12.5px; color: var(--text-muted); }
.mc-weights-row strong { color: var(--navy-deep); }
.mc-result-banner { text-align: center; background: #fff; border: 3px solid var(--navy); border-radius: 14px; padding: 24px; margin-top: 18px; }
.mc-result-label { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--text-muted); }
.mc-result-value { font-family: var(--font-display); font-size: 48px; font-weight: 800; margin: 8px 0; }
.mc-result-sub { font-size: 12.5px; color: var(--text-muted); max-width: 480px; margin: 0 auto; line-height: 1.5; }

.btn-add { margin-top: 14px; display: flex; align-items: center; gap: 8px; border: 1.5px dashed var(--grid-line); background: transparent; color: var(--navy); font-weight: 600; font-size: 13px; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
.btn-add:hover { border-color: var(--orange); color: var(--orange); }

.summary-strip { margin-top: 20px; padding: 16px 20px; background: var(--navy-deep); border-radius: 10px; color: #fff; display: flex; }
.summary-strip span { font-size: 12px; opacity: 0.7; display: block; margin-bottom: 4px; }
.summary-strip strong { font-family: var(--font-mono); font-size: 22px; }

.gapbar { margin-bottom: 16px; }
.gapbar-top { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 6px; }
.gapbar-top span:first-child { font-weight: 600; color: var(--text-main); }
.gapbar-short { color: var(--alert); font-weight: 600; }
.gapbar-ok { color: var(--green); font-weight: 600; }
.gapbar-track { height: 8px; background: var(--ring-track); border-radius: 6px; overflow: hidden; }
.gapbar-fill { height: 100%; background: linear-gradient(90deg, var(--orange), var(--gold)); border-radius: 6px; }

.legend-row { display: flex; gap: 20px; margin-top: 10px; font-size: 11.5px; color: var(--text-muted); }
.legend-row span { display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

.hero-banner { display: flex; align-items: center; background: var(--navy-deep); border-radius: 14px; padding: 26px 30px; color: #fff; gap: 30px; }
.hero-divider { width: 1px; align-self: stretch; background: rgba(255,255,255,0.15); }
.hero-label { font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 6px; }
.hero-value { font-family: var(--font-display); font-size: 30px; font-weight: 700; color: #fff; }
.hero-value span { font-size: 14px; font-weight: 400; color: rgba(255,255,255,0.55); margin-left: 4px; }
.hero-value-sub { color: var(--gold); }
.hero-alert { color: #F0958B; }
.hero-ok { color: #8FD6B4; }

.ring-card { background: #fff; border: 1px solid var(--grid-line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.ring-label { font-size: 12.5px; font-weight: 600; color: var(--text-muted); }
.ring-warn { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--alert); }

.flag-pill { padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; text-align: center; }
.flag-bad { background: #FBEDEA; color: #9A3B2F; }
.flag-good { background: #E9F3EE; color: #245C42; }

.cta-banner { margin-top: 22px; display: flex; gap: 16px; background: linear-gradient(135deg, var(--orange), #C9591D); color: #fff; padding: 22px 26px; border-radius: 12px; align-items: flex-start; }
.cta-title { font-family: var(--font-display); font-size: 16px; font-weight: 700; margin-bottom: 6px; }
.cta-body { font-size: 13px; line-height: 1.6; opacity: 0.95; max-width: 640px; }

.mode-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.mode-tab { border: 1.5px solid var(--grid-line); background: #fff; color: var(--text-muted); font-size: 12.5px; font-weight: 600; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-family: var(--font-body); transition: all 0.15s; }
.mode-tab:hover { border-color: var(--orange); color: var(--orange); }
.mode-tab.is-active { background: var(--navy-deep); border-color: var(--navy-deep); color: #fff; }

.invest-table { margin-top: 16px; max-height: 260px; overflow-y: auto; border: 1px solid var(--grid-line); border-radius: 8px; }
.invest-table table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.invest-table thead th { position: sticky; top: 0; background: var(--navy-deep); color: #fff; text-align: left; padding: 9px 12px; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
.invest-table tbody td { padding: 8px 12px; font-family: var(--font-mono); color: var(--text-main); border-top: 1px solid var(--grid-line); }
.invest-table tbody tr:nth-child(even) { background: #FBF9F4; }
.invest-table td.accent { color: var(--green); }
.invest-table td.accent-alert { color: var(--alert); font-weight: 600; }

.goal-test-btn { margin-left: auto; display: flex; align-items: center; gap: 6px; border: 1px solid var(--grid-line); background: #fff; color: var(--navy); font-size: 11.5px; font-weight: 600; padding: 6px 12px; border-radius: 20px; cursor: pointer; }
.goal-test-btn:hover { border-color: var(--orange); color: var(--orange); }

.link-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

.child-list { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 10px; }
.child-row { display: flex; align-items: center; gap: 8px; }
.child-name-input { flex: 2; border: 1.5px solid var(--grid-line); border-radius: 8px; padding: 8px 12px; font-size: 13px; font-family: var(--font-body); background: #FDFBF7; }
.child-age-input { flex: 1; border: 1.5px solid var(--grid-line); border-radius: 8px; padding: 8px 12px; font-size: 13px; font-family: var(--font-mono); background: #FDFBF7; max-width: 90px; }
.child-name-input:focus, .child-age-input:focus { outline: none; border-color: var(--orange); }

.family-goal-strip { display: flex; align-items: center; justify-content: space-between; gap: 14px; background: #FBF3E4; border: 1px solid var(--gold); border-radius: 10px; padding: 12px 18px; margin-bottom: 16px; font-size: 13px; color: #7A5A1E; }

.alt-strategy-note { display: flex; align-items: center; gap: 8px; background: #FBF3E4; border: 1px solid var(--gold); border-radius: 8px; padding: 10px 14px; margin-top: 14px; font-size: 12.5px; color: #7A5A1E; line-height: 1.6; }
.btn-link { display: flex; align-items: center; gap: 7px; border: 1.5px solid var(--navy); background: #fff; color: var(--navy); font-size: 12.5px; font-weight: 600; padding: 9px 16px; border-radius: 8px; cursor: pointer; }
.btn-link:hover { background: var(--navy); color: #fff; }

.link-banner { display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #FBF3E4; border: 1px solid var(--gold); border-radius: 10px; padding: 12px 18px; margin-bottom: 16px; }
.link-banner-title { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: #7A5A1E; }
.link-banner-detail { font-size: 12px; color: #8A6A2E; margin-top: 3px; }
.link-banner-clear { border: none; background: transparent; color: #8A6A2E; font-size: 11.5px; font-weight: 600; cursor: pointer; text-decoration: underline; white-space: nowrap; }

.hero-cta { margin-top: 10px; display: flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); color: #fff; font-size: 11.5px; font-weight: 600; padding: 7px 12px; border-radius: 20px; cursor: pointer; }
.hero-cta:hover { background: rgba(255,255,255,0.18); }

.field-disabled .field-input-wrap { background: #F3EFE4; border-color: var(--grid-line); }
.field-disabled input { color: var(--text-muted); cursor: not-allowed; }
.live-badge { margin-left: 7px; font-size: 9px; font-weight: 700; background: var(--gold); color: #fff; padding: 1px 7px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.04em; vertical-align: middle; }
.mode-tab.is-disabled { opacity: 0.35; cursor: not-allowed; }
.mode-tab.is-disabled:hover { border-color: var(--grid-line); color: var(--text-muted); }

@media (max-width: 900px) {
  .wb-root { flex-direction: column; }
  .wb-sidebar { width: 100%; flex-direction: row; align-items: center; overflow-x: auto; }
  .wb-nav { flex-direction: row; }
  .wb-sidebar-footer { display: none; }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .hero-banner { flex-direction: column; gap: 16px; }
  .hero-divider { display: none; }
}
`;
